name: Windows Rust checks

on:
  workflow_call:
    secrets:
      STK_SIGNING_PFX_BASE64:
        required: false
      STK_SIGNING_PFX_PASSWORD:
        required: false
  push:
    branches: [main, "fix/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

# 同一分支的新提交替代旧检查；标签发版不与分支检查相互取消。
concurrency:
  group: windows-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  check:
    name: Windows x64 workspace
    runs-on: windows-2022
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - name: 初始化构建与真实渲染环境
        shell: pwsh
        run: |
          . ./tools/set_build_cache.ps1
          foreach ($key in @('CARGO_HOME', 'CARGO_TARGET_DIR', 'TEMP', 'TMP')) {
            "$key=$([Environment]::GetEnvironmentVariable($key))" >> $env:GITHUB_ENV
          }
          "STK_LIBASS_DLL=$env:GITHUB_WORKSPACE/third_party/libass-9.dll" >> $env:GITHUB_ENV
          "STK_RENDERER_HOST=$env:CARGO_TARGET_DIR/debug/subtitletool-render-host.exe" >> $env:GITHUB_ENV
          'STK_REQUIRE_LIBASS=1' >> $env:GITHUB_ENV
          "FONTCONFIG_PATH=$env:GITHUB_WORKSPACE/third_party/etc/fonts" >> $env:GITHUB_ENV
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows-x64-release-v1
          cache-on-failure: true
      - name: Check format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Unit and integration tests
        run: |
          cargo build --locked -p renderer-host
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked --workspace --lib --tests --no-fail-fast
      - name: Doctests
        run: cargo test --locked --workspace --doc --no-fail-fast -j 1
      - name: Build release executables
        run: cargo build --locked --workspace --release
      - name: Audit regressions
        run: cargo test -p cli --test audit_regressions -- --nocapture
      - name: 导入可选签名证书
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        shell: pwsh
        env:
          PFX_BASE64: ${{ secrets.STK_SIGNING_PFX_BASE64 }}
          PFX_PASSWORD: ${{ secrets.STK_SIGNING_PFX_PASSWORD }}
        run: |
          if (-not $env:PFX_BASE64) { Write-Host '未配置签名证书，本次产物为未签名预览版。'; exit 0 }
          $cert = [Security.Cryptography.X509Certificates.X509Certificate2]::new(
            [Convert]::FromBase64String($env:PFX_BASE64), $env:PFX_PASSWORD,
            [Security.Cryptography.X509Certificates.X509KeyStorageFlags]::PersistKeySet)
          $store = [Security.Cryptography.X509Certificates.X509Store]::new('My', 'CurrentUser')
          try { $store.Open('ReadWrite'); $store.Add($cert) } finally { $store.Close() }
          "STK_SIGNING_CERT_THUMBPRINT=$($cert.Thumbprint)" >> $env:GITHUB_ENV
      - name: 构建并验证便携包和 Inno Setup 安装包
        shell: pwsh
        run: |
          $iscc = ./tools/install_innosetup.ps1
          $tag = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME } else { '' }
          ./tools/make_release.ps1 -NoBuild -IsccPath $iscc -OutDir "$env:RUNNER_TEMP/release" -Tag $tag -Sign:([bool]$env:STK_SIGNING_CERT_THUMBPRINT)
          $setup = @(Get-ChildItem "$env:RUNNER_TEMP/release/installer" -Filter '*-setup.exe')
          if ($setup.Count -ne 1) { throw '安装器产物数量必须为 1' }
          ./tools/verify_installer.ps1 -Setup ($setup[0].FullName)
      - name: 上传已验证发布资产
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-x64-release
          path: ${{ runner.temp }}/release/assets/*
          if-no-files-found: error
      - name: 上传诊断记录
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-x64-diagnostics
          path: |
            ${{ runner.temp }}/stk-package-check-*/**
            target/tmp/stk-package-check-*/**
            target/gate/**
          if-no-files-found: ignore
