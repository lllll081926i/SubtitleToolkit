# 工程级镜像设置：与用户级 ~/.cargo/config.toml 一致，保证 CI/新机器同样走国内源
[source.crates-io]
replace-with = "rsproxy-sparse"

[source.rsproxy-sparse]
registry = "sparse+https://rsproxy.cn/index/"

[net]
git-fetch-with-cli = true

# 编译器、链接器和 build script 的临时文件放到仓库所在磁盘。
[env]
TEMP = { value = "target/tmp", relative = true, force = true }
TMP = { value = "target/tmp", relative = true, force = true }
TMPDIR = { value = "target/tmp", relative = true, force = true }
